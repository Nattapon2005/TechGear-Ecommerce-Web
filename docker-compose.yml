services:
  web:
    build: .
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    environment:
      # ถ้าไม่ตั้งค่าใน .env จะใช้ค่าเริ่มต้นของ docker-compose (db / root / root)
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
      DB_NAME: ${DB_NAME:-techgear_v2_db}
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: techgear_v2_db
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8091:80"    # ✅ เปลี่ยนจาก 8080 → 8091
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
